<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
<title id="title">Two reservation limits define a feasible price interval</title><desc id="desc">The supplier floor is C$1.1099 and buyer ceiling is C$1.1277. Of four displayed price ticks, C$1.11 and C$1.12 are feasible.</desc>
<defs>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d5d9ca" opacity=".55"/></pattern>
 <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#25372d"/></marker>
</defs>
<rect width="640" height="400" rx="12" fill="#f9f6ea"/>
<rect x="16" y="16" width="608" height="368" rx="5" fill="url(#grid)" stroke="#d5d9ca"/>
<text x="43" y="65" fill="#25372d" font-family="system-ui, sans-serif" font-size="27" font-weight="600" text-anchor="start">A price both sides can accept</text><text x="43" y="93" fill="#4e5d50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">ABC ELECTRONICS  /  FIXED TWO-WEEK PACKAGE</text><rect x="207" y="116" width="236" height="153" rx="6" fill="#dbe7d7" stroke="none"/><path d="M74 232 L571 232" fill="none" stroke="#25372d" stroke-width="2" /><path d="M76 154 L443 154" fill="none" stroke="#55735c" stroke-width="4" marker-start="url(#arrow)"/><text x="82" y="140" fill="#55735c" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="start">Buyer ceiling</text><path d="M207 190 L568 190" fill="none" stroke="#a74631" stroke-width="4" marker-end="url(#arrow)"/><text x="558" y="178" fill="#a74631" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="end">Supplier floor</text><path d="M76 226 L76 242" fill="none" stroke="#25372d" stroke-width="2" /><circle cx="76" cy="232" r="5" fill="#8b9183"/><text x="76" y="263" fill="#25372d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1.10</text><path d="M208 226 L208 242" fill="none" stroke="#25372d" stroke-width="2" /><circle cx="208" cy="232" r="8" fill="#55735c"/><text x="208" y="263" fill="#25372d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1.11</text><path d="M341 226 L341 242" fill="none" stroke="#25372d" stroke-width="2" /><circle cx="341" cy="232" r="8" fill="#55735c"/><text x="341" y="263" fill="#25372d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1.12</text><path d="M473 226 L473 242" fill="none" stroke="#25372d" stroke-width="2" /><circle cx="473" cy="232" r="5" fill="#8b9183"/><text x="473" y="263" fill="#25372d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1.13</text><path d="M207 270 L207 290" fill="none" stroke="#55735c" stroke-width="2" /><path d="M443 270 L443 290" fill="none" stroke="#55735c" stroke-width="2" /><text x="207" y="313" fill="#55735c" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">C$1.1099</text><text x="443" y="313" fill="#55735c" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">C$1.1277</text><text x="324" y="353" fill="#4e5d50" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Unit price in C$ · green area clears both fallbacks</text>
</svg>
